name = "bitchat-private-relay"
main = "worker.js"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "INVITE_DIRECTORY"
class_name = "InviteDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InviteDirectory"]
