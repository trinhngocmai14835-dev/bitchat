name: iOS validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator target
        run: >-
          xcodebuild
          -project bitchat.xcodeproj
          -scheme "bitchat (iOS)"
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

  package-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift package tests
        run: swift test

